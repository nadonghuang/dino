[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dino-run"
version = "1.0.0"
description = "🦕 Chrome Dinosaur Game in Your Terminal — jump, duck, survive!"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "nadonghuang"}]
keywords = ["dino", "dinosaur", "game", "terminal", "tui", "curses", "chrome"]
classifiers = [
    "Environment :: Console :: Curses",
    "Topic :: Games/Entertainment :: Arcade",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
dino-run = "dino:main"

[tool.setuptools]
py-modules = ["dino"]
